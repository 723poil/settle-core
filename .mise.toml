[tools]
java = "corretto-21"
kotlin = "2.2.21"

[env]
JAVA_TOOL_OPTIONS = "-Dfile.encoding=UTF-8"

[tasks.infra-up]
description = "로컬 PostgreSQL, Redis, Kafka 컨테이너 실행"
run = "docker compose up -d postgres redis kafka"

[tasks.infra-down]
description = "로컬 인프라 컨테이너 종료"
run = "docker compose down"

[tasks.infra-ps]
description = "로컬 인프라 컨테이너 상태 확인"
run = "docker compose ps postgres redis kafka"

[tasks.flyway-info]
description = "Flyway migration 상태 조회"
depends = ["infra-up"]
run = "./gradlew flywayInfo"

[tasks.flyway-validate]
description = "Flyway migration 파일 검증"
depends = ["infra-up"]
run = "./gradlew flywayValidate"

[tasks.flyway-migrate]
description = "대기 중인 Flyway migration 적용"
depends = ["infra-up"]
run = "./gradlew flywayMigrate"

[tasks.flyway-repair]
description = "Flyway schema history 메타데이터 복구"
depends = ["infra-up"]
run = "./gradlew flywayRepair"

[tasks.api]
description = "API 서버 실행"
depends = ["infra-up"]
run = "./gradlew :apps:api:bootRun"

[tasks.api-dev]
description = "API 서버 개발 모드 실행"
depends = ["infra-up"]
run = """
./gradlew :apps:api:classes --continuous &
watch_pid=$!
trap 'kill $watch_pid' EXIT
./gradlew :apps:api:bootRun
"""

[tasks.scheduler]
description = "스케줄러 프로세스 실행"
depends = ["infra-up"]
run = "./gradlew :apps:scheduler:bootRun"

[tasks.scheduler-dev]
description = "스케줄러 개발 모드 실행"
depends = ["infra-up"]
run = """
./gradlew :apps:scheduler:classes --continuous &
watch_pid=$!
trap 'kill $watch_pid' EXIT
./gradlew :apps:scheduler:bootRun
"""

[tasks.check]
description = "포맷 검사와 테스트 실행"
run = "./gradlew spotlessCheck check"

[tasks.test-payment]
description = "Payment 모듈 테스트 실행"
run = "./gradlew :domains:payment:test"

[tasks.coverage]
description = "전체 프로젝트 테스트 커버리지 HTML 리포트 생성"
run = "./gradlew koverHtmlReport"

[tasks.coverage-xml]
description = "전체 프로젝트 테스트 커버리지 XML 리포트 생성"
run = "./gradlew koverXmlReport"

[tasks.coverage-log]
description = "전체 프로젝트 테스트 커버리지 수치 출력"
run = "./gradlew koverLog"

[tasks.coverage-verify]
description = "전체 프로젝트 테스트 커버리지 기준 검증"
run = "./gradlew koverVerify"

[tasks.coverage-payment]
description = "Payment 모듈 테스트 커버리지 HTML 리포트 생성"
run = "./gradlew :domains:payment:koverHtmlReport"

[tasks.coverage-payment-xml]
description = "Payment 모듈 테스트 커버리지 XML 리포트 생성"
run = "./gradlew :domains:payment:koverXmlReport"

[tasks.format]
description = "Kotlin과 기타 파일 포맷 적용"
run = "./gradlew spotlessApply"

[hooks]
enter = { task = "infra-up" }
