spring:
  application:
    name: settle-core-scheduler
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/settle_core}
    username: ${DB_USERNAME:settle}
    password: ${DB_PASSWORD:settle}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: false
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:settle-core-scheduler}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

settle:
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}

pg:
  circuit-breaker:
    failure-rate-threshold: ${PG_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50}
    slow-call-rate-threshold: ${PG_CIRCUIT_BREAKER_SLOW_CALL_RATE_THRESHOLD:100}
    slow-call-duration-threshold: ${PG_CIRCUIT_BREAKER_SLOW_CALL_DURATION_THRESHOLD:3s}
    minimum-number-of-calls: ${PG_CIRCUIT_BREAKER_MINIMUM_NUMBER_OF_CALLS:10}
    sliding-window-size: ${PG_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:20}
    wait-duration-in-open-state: ${PG_CIRCUIT_BREAKER_WAIT_DURATION_IN_OPEN_STATE:30s}
    permitted-number-of-calls-in-half-open-state: ${PG_CIRCUIT_BREAKER_PERMITTED_NUMBER_OF_CALLS_IN_HALF_OPEN_STATE:3}
  toss-payments:
    secret-key: ${PG_TOSS_PAYMENTS_SECRET_KEY:}
    base-url: ${PG_TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
  paypal:
    access-token: ${PG_PAYPAL_ACCESS_TOKEN:}
    base-url: ${PG_PAYPAL_BASE_URL:https://api-m.paypal.com}
  kiwoom-pay:
    accounts:
      - cpid: ${PG_KIWOOM_PAY_CPID:}
        type: ${PG_KIWOOM_PAY_TYPE:PAYMENT}
        authorization-key: ${PG_KIWOOM_PAY_AUTHORIZATION_KEY:}
        ready-url: ${PG_KIWOOM_PAY_READY_URL:https://apitest.kiwoompay.co.kr/pay/ready}

logging:
  level:
    org.apache.kafka.common.config.AbstractConfig: WARN
