spring:
  application:
    name: settle-core-api
  datasource:
    url: ${SETTLE_DB_URL:jdbc:postgresql://localhost:5432/settle_core}
    username: ${SETTLE_DB_USERNAME:settle}
    password: ${SETTLE_DB_PASSWORD:settle}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
