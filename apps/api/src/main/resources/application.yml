spring:
  application:
    name: settle-core-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/settle_core}
    username: ${DB_USERNAME:settle}
    password: ${DB_PASSWORD:settle}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: false
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:settle-core-api}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${SERVER_PORT:8080}

pg:
  toss-payments:
    secret-key: ${PG_TOSS_PAYMENTS_SECRET_KEY:}
    base-url: ${PG_TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
  paypal:
    access-token: ${PG_PAYPAL_ACCESS_TOKEN:}
    base-url: ${PG_PAYPAL_BASE_URL:https://api-m.paypal.com}
  kiwoom-pay:
    accounts:
      - cpid: ${PG_KIWOOM_PAY_CPID:}
        type: ${PG_KIWOOM_PAY_TYPE:PAYMENT}
        authorization-key: ${PG_KIWOOM_PAY_AUTHORIZATION_KEY:}
        ready-url: ${PG_KIWOOM_PAY_READY_URL:https://apitest.kiwoompay.co.kr/pay/ready}

logging:
  level:
    org.apache.kafka.common.config.AbstractConfig: WARN
